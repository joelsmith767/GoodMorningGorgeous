name: Trigger staging deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy workflow on the staging repo
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.STAGING_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/joelsmith767/GoodMorningGorgeous-staging/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
